[project]
name = "systemic-cyber-scr"
version = "0.1.0"
description = "Pipeline estimating the Solvency Capital Requirement for systemic cyber risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kwoongbae", email = "kw.bae@60hz.io" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

# This repository is a set of pipeline scripts, not an installable library.
# `uv sync` (or `pip install numpy pandas scipy`) just provisions the deps.
[tool.uv]
package = false
